[project]
name = "otel-canary"
version = "0.1.0.dev0"
description = "Daily compatibility canary for LLM observability SDKs against OpenTelemetry Python releases and main"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  # Parses the OTLP payloads the mock receivers get. The SDKs under test are installed in
  # separate virtualenvs, so nothing here constrains their OpenTelemetry versions.
  "opentelemetry-proto>=1.25.0",
  # The gRPC mock receiver.
  "grpcio>=1.60.0",
]

[project.scripts]
otel-canary = "otel_canary.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  # Used by the receiver tests to send real OTLP/HTTP requests.
  "opentelemetry-sdk>=1.25.0",
  "opentelemetry-exporter-otlp-proto-http>=1.25.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otel_canary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
  "integration: installs real SDKs with uv and needs network access (run with -m integration)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
# docs/ keeps hand-aligned examples; spike/ is kept exactly as it ran for M0.
extend-exclude = ["docs", "spike"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The dashboard's HTML and CSS templates read better unwrapped.
"src/otel_canary/report.py" = ["E501"]
